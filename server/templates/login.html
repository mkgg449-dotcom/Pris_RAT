<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pris.RAT — تسجيل الدخول</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Tahoma', sans-serif; }

body {
  background: #000;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #fff;
  position: relative;
  overflow: hidden;
}

/* خلفية متحركة */
body::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,0,51,0.15) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0,100,255,0.1) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(255,0,51,0.05) 0%, transparent 60%);
  animation: bgMove 20s ease-in-out infinite;
  z-index: 0;
}
@keyframes bgMove {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

/* شبكة خلفية */
body::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,0,51,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,0,51,0.05) 1px, transparent 1px);
  background-size: 50px 50px;
  z-index: 0;
  mask-image: radial-gradient(circle at center, black 30%, transparent 70%);
}

.login-container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
}

/* اللوقو */
.logo-section {
  text-align: center;
  margin-bottom: 30px;
}

.logo-circle {
  width: 100px;
  height: 100px;
  margin: 0 auto 20px;
  background: radial-gradient(circle, rgba(255,0,51,0.3), rgba(100,0,20,0.8));
  border: 3px solid #ff0033;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 55px;
  box-shadow: 
    0 0 30px rgba(255,0,51,0.7),
    0 0 60px rgba(255,0,51,0.4),
    inset 0 0 30px rgba(255,0,51,0.2);
  animation: logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse {
  0%, 100% { box-shadow: 0 0 30px rgba(255,0,51,0.7), 0 0 60px rgba(255,0,51,0.4), inset 0 0 30px rgba(255,0,51,0.2); }
  50% { box-shadow: 0 0 50px rgba(255,0,51,1), 0 0 100px rgba(255,0,51,0.6), inset 0 0 40px rgba(255,0,51,0.3); }
}

.logo-title {
  font-size: 42px;
  font-weight: bold;
  letter-spacing: 4px;
  text-shadow: 0 0 20px rgba(255,0,51,0.8);
}
.logo-title span {
  color: #ff0033;
  text-shadow: 0 0 30px #ff0033, 0 0 60px #ff0033;
}

.logo-subtitle {
  color: #888;
  font-size: 11px;
  letter-spacing: 6px;
  margin-top: 8px;
  text-transform: uppercase;
}

/* الصندوق */
.login-box {
  background: linear-gradient(135deg, rgba(15,15,25,0.98), rgba(25,10,20,0.98));
  border: 2px solid #ff0033;
  border-radius: 20px;
  padding: 40px 30px;
  box-shadow: 
    0 0 40px rgba(255,0,51,0.4),
    inset 0 0 30px rgba(255,0,51,0.05);
  position: relative;
}

/* زوايا الصندوق */
.login-box::before,
.login-box::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  border: 3px solid #ff0033;
}
.login-box::before {
  top: -2px;
  right: -2px;
  border-left: none;
  border-bottom: none;
  border-top-right-radius: 20px;
}
.login-box::after {
  bottom: -2px;
  left: -2px;
  border-right: none;
  border-top: none;
  border-bottom-left-radius: 20px;
}

.form-title {
  text-align: center;
  color: #fff;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 25px;
  padding-bottom: 15px;
  border-bottom: 1px solid #333;
}

/* حقول الإدخال */
.input-group {
  position: relative;
  margin-bottom: 18px;
}

.input-icon {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  color: #ff0033;
  pointer-events: none;
  z-index: 2;
}

.input-group input {
  width: 100%;
  background: rgba(0,0,0,0.6);
  border: 2px solid #333;
  border-radius: 12px;
  padding: 16px 50px 16px 16px;
  color: #fff;
  font-size: 15px;
  outline: none;
  transition: all 0.3s;
  font-family: inherit;
}
.input-group input::placeholder {
  color: #666;
}
.input-group input:focus {
  border-color: #ff0033;
  background: rgba(255,0,51,0.05);
  box-shadow: 0 0 20px rgba(255,0,51,0.4);
}

/* زر تسجيل الدخول */
.btn-login {
  width: 100%;
  background: linear-gradient(135deg, #ff0033, #990000);
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 16px;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 3px;
  cursor: pointer;
  margin-top: 10px;
  box-shadow: 
    0 0 25px rgba(255,0,51,0.6),
    inset 0 2px 0 rgba(255,255,255,0.2);
  transition: all 0.3s;
  font-family: inherit;
  position: relative;
  overflow: hidden;
}
.btn-login:hover {
  box-shadow: 0 0 40px rgba(255,0,51,1);
  transform: translateY(-2px);
}
.btn-login:active {
  transform: translateY(0);
  box-shadow: 0 0 20px rgba(255,0,51,0.6);
}

/* تذكرني */
.remember-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 15px 0;
  color: #888;
  font-size: 13px;
  cursor: pointer;
  user-select: none;
}
.remember-row input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: #ff0033;
  cursor: pointer;
}

/* رسالة الخطأ */
.error-box {
  background: rgba(255,0,0,0.15);
  border: 1px solid #f00;
  border-radius: 10px;
  padding: 12px;
  margin-top: 15px;
  color: #ff4444;
  font-size: 13px;
  text-align: center;
  display: none;
}
.error-box.show { display: block; }

/* الفوتر */
.footer {
  text-align: center;
  margin-top: 25px;
  padding-top: 20px;
  border-top: 1px solid #222;
  color: #444;
  font-size: 11px;
  letter-spacing: 2px;
}

/* نسخة الموبايل */
@media (max-width: 500px) {
  .login-box { padding: 30px 20px; }
  .logo-title { font-size: 32px; }
  .logo-circle { width: 80px; height: 80px; font-size: 45px; }
  .logo-subtitle { font-size: 9px; letter-spacing: 4px; }
}
</style>
</head>
<body>

<div class="login-container">
  
  <!-- اللوقو -->
  <div class="logo-section">
    <div class="logo-circle">🐺</div>
    <div class="logo-title">Pris.<span>RAT</span></div>
    <div class="logo-subtitle">Remote Access Tool</div>
  </div>

  <!-- صندوق الدخول -->
  <div class="login-box">
    <div class="form-title">🔐 تسجيل الدخول</div>

    <form method="POST" action="/login">
      
      <div class="input-group">
        <span class="input-icon">👤</span>
        <input type="text" name="username" placeholder="اسم المستخدم" required autocomplete="off">
      </div>

      <div class="input-group">
        <span class="input-icon">🔑</span>
        <input type="password" name="password" placeholder="كلمة المرور" required>
      </div>

      <div class="remember-row">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember">تذكرني على هذا الجهاز</label>
      </div>

      <button type="submit" class="btn-login">دخول</button>

      {% if error %}
      <div class="error-box show">⚠️ {{ error }}</div>
      {% endif %}

    </form>

    <div class="footer">POWERED BY PRIS.RAT · 2026</div>
  </div>

</div>

</body>
</html>
