<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pris.RAT — Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Tahoma', sans-serif; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* الصورة كخلفية كاملة */
.bg-image {
  position: fixed;
  inset: 0;
  background-image: url('https://i.imgur.com/cPQL4sV.png');
  background-size: contain;
  background-position: center center;
  background-repeat: no-repeat;
  background-color: #000;
  z-index: 1;
}

/* الفورم شفاف فوق الصورة */
.login-overlay {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 500px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  /* مكان الصندوق داخل الصورة */
  padding-top: 55%;
}

/* الحقول الشفافة */
.login-form {
  width: 78%;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.input-group {
  position: relative;
  width: 100%;
}

.input-group input {
  width: 100%;
  background: rgba(10, 15, 25, 0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(80, 100, 130, 0.5);
  border-radius: 8px;
  padding: 11px 40px 11px 14px;
  color: #fff;
  font-size: 14px;
  outline: none;
  transition: all 0.3s;
  font-family: inherit;
}

.input-group input::placeholder {
  color: rgba(150, 170, 200, 0.6);
}

.input-group input:focus {
  border-color: #ff0033;
  background: rgba(255, 0, 51, 0.08);
  box-shadow: 0 0 15px rgba(255, 0, 51, 0.5);
}

.input-icon {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 15px;
  color: #ff0033;
  pointer-events: none;
  opacity: 0.8;
}

/* زر الدخول - شفاف عشان يبان زر الصورة */
.btn-login {
  width: 100%;
  background: rgba(255, 0, 51, 0.35);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  color: #fff;
  border: 1px solid rgba(255, 0, 51, 0.6);
  border-radius: 8px;
  padding: 11px;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 2px;
  cursor: pointer;
  margin-top: 3px;
  transition: all 0.3s;
  font-family: inherit;
  box-shadow: 0 0 15px rgba(255, 0, 51, 0.4);
}

.btn-login:hover {
  background: rgba(255, 0, 51, 0.6);
  box-shadow: 0 0 25px rgba(255, 0, 51, 0.8);
}

.btn-login:active { transform: scale(0.98); }

/* رسالة الخطأ */
.error-msg {
  background: rgba(255, 0, 0, 0.2);
  border: 1px solid #f00;
  border-radius: 6px;
  padding: 8px;
  color: #ff6666;
  font-size: 12px;
  text-align: center;
  display: none;
}
.error-msg.show { display: block; }

/* تذكرني */
.remember-row {
  display: flex;
  align-items: center;
  gap: 8px;
  color: rgba(200, 210, 230, 0.8);
  font-size: 12px;
  cursor: pointer;
  user-select: none;
  justify-content: flex-start;
}

.remember-row input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: #ff0033;
  cursor: pointer;
}

/* نسخة الموبايل */
@media (max-width: 600px) {
  .login-overlay { padding-top: 60%; }
  .login-form { width: 82%; max-width: 300px; gap: 9px; }
  .input-group input { padding: 10px 36px 10px 12px; font-size: 13px; }
  .btn-login { padding: 10px; font-size: 14px; }
  .remember-row { font-size: 11px; }
}
</style>
</head>
<body>

<div class="bg-image"></div>

<div class="login-overlay">
  <form method="POST" action="/login" class="login-form">
    
    <div class="input-group">
      <input type="text" name="username" placeholder="Username" required autocomplete="off">
      <span class="input-icon">👤</span>
    </div>

    <div class="input-group">
      <input type="password" name="password" placeholder="Password" required>
      <span class="input-icon">🔑</span>
    </div>

    <button type="submit" class="btn-login">Login</button>

    <label class="remember-row">
      <input type="checkbox" name="remember">
      <span>Remember me</span>
    </label>

    {% if error %}
    <div class="error-msg show">⚠️ {{ error }}</div>
    {% endif %}

  </form>
</div>

</body>
</html>
