<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pris.RAT — Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Tahoma', sans-serif; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.bg-image {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url('https://i.imgur.com/cPQL4sV.png');
  background-size: contain;
  background-position: center center;
  background-repeat: no-repeat;
  background-color: #000;
  z-index: 1;
}

.login-overlay {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 8vh;
}

.login-form {
  width: 300px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.input-group {
  position: relative;
  width: 100%;
}

.input-group input {
  width: 100%;
  background: rgba(5, 10, 20, 0.85);
  border: 1px solid rgba(80, 100, 130, 0.4);
  border-radius: 6px;
  padding: 10px 38px 10px 14px;
  color: #fff;
  font-size: 13px;
  outline: none;
  transition: all 0.3s;
  font-family: inherit;
  height: 42px;
}

.input-group input::placeholder {
  color: rgba(140, 160, 190, 0.55);
  font-size: 13px;
}

.input-group input:focus {
  border-color: #ff0033;
  background: rgba(255, 0, 51, 0.1);
  box-shadow: 0 0 12px rgba(255, 0, 51, 0.4);
}

.input-icon {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  color: #ff0033;
  pointer-events: none;
  opacity: 0.7;
}

.btn-login {
  width: 100%;
  background: linear-gradient(135deg, rgba(255,0,51,0.85), rgba(180,0,40,0.85));
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 10px;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 1.5px;
  cursor: pointer;
  height: 42px;
  font-family: inherit;
  box-shadow: 0 0 15px rgba(255, 0, 51, 0.5);
  transition: all 0.3s;
}

.btn-login:hover {
  box-shadow: 0 0 25px rgba(255, 0, 51, 0.9);
}

.remember-row {
  display: flex;
  align-items: center;
  gap: 7px;
  color: rgba(180, 190, 210, 0.7);
  font-size: 11px;
  cursor: pointer;
  padding-right: 5px;
}

.remember-row input[type="checkbox"] {
  width: 14px;
  height: 14px;
  accent-color: #ff0033;
  cursor: pointer;
}

.error-msg {
  background: rgba(255, 0, 0, 0.2);
  border: 1px solid #f00;
  border-radius: 6px;
  padding: 8px;
  color: #ff6666;
  font-size: 12px;
  text-align: center;
  display: none;
}
.error-msg.show { display: block; }

@media (max-width: 600px) {
  .login-form { width: 260px; gap: 8px; }
  .input-group input { height: 38px; padding: 8px 34px 8px 12px; font-size: 12px; }
  .btn-login { height: 38px; font-size: 13px; }
  .login-overlay { padding-top: 5vh; }
}
</style>
</head>
<body>

<div class="bg-image"></div>

<div class="login-overlay">
  <form method="POST" action="/login" class="login-form" autocomplete="off">
    
    <div class="input-group">
      <input type="text" name="username" placeholder="Username" required>
      <span class="input-icon">👤</span>
    </div>

    <div class="input-group">
      <input type="password" name="password" placeholder="Password" required>
      <span class="input-icon">🔑</span>
    </div>

    <button type="submit" class="btn-login">Login</button>

    <label class="remember-row">
      <input type="checkbox" name="remember">
      <span>Remember me</span>
    </label>

    {% if error %}
    <div class="error-msg show">⚠️ {{ error }}</div>
    {% endif %}

  </form>
</div>

</body>
</html>
