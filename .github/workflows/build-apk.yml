name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mingc/android-build-box:latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK
        working-directory: ./victim-apk
        run: gradle assembleDebug --no-daemon
      
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tool-APK
          path: victim-apk/app/build/outputs/apk/debug/*.apk