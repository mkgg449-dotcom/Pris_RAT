name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java
        run: java -version

      - name: Install Gradle 7.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip
          unzip -q gradle-7.5-bin.zip -d /opt
          echo "/opt/gradle-7.5/bin" >> $GITHUB_PATH

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/sdk/cmdline-tools
          cd $HOME/sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$HOME/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/sdk" >> $GITHUB_ENV
          echo "$HOME/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | $HOME/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $HOME/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.1" "platform-tools" > /dev/null

      - name: Build APK
        working-directory: ./victim-apk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tool-APK
          path: victim-apk/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn